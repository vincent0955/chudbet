services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - app_net

  backend:
    # Set by the deploy pipeline in .env.prod to the ECR image for the deployed
    # commit (e.g. <account>.dkr.ecr.<region>.amazonaws.com/chudbet-backend:<sha>).
    image: ${BACKEND_IMAGE:-chudbet-backend}
    restart: unless-stopped
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      CHUDBET_CORS_ORIGINS: ${CHUDBET_CORS_ORIGINS}
      CHUDBET_SEED_DEMO_WALLET: ${CHUDBET_SEED_DEMO_WALLET:-false}
      CHUDBET_DEMO_ACCOUNT_ID: ${CHUDBET_DEMO_ACCOUNT_ID:-1}
      CHUDBET_DEMO_WALLET_CENTS: ${CHUDBET_DEMO_WALLET_CENTS:-10000000}
      # Optional: Decodo / residential ISP proxy for nba_api (stats.nba.com). Set in `.env.prod` only on the server.
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      NO_PROXY: ${NO_PROXY:-postgres,backend,localhost,127.0.0.1}
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()",
        ]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - app_net

  worker:
    # Same image as backend; only the command differs.
    image: ${BACKEND_IMAGE:-chudbet-backend}
    command: ["python", "-m", "app.worker.main"]
    restart: unless-stopped
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      NBA_SEASON: ${NBA_SEASON:-2025-26}
      WORKER_INGEST_INTERVAL_SEC: ${WORKER_INGEST_INTERVAL_SEC:-900}
      WORKER_SETTLE_INTERVAL_SEC: ${WORKER_SETTLE_INTERVAL_SEC:-120}
      WORKER_SCOREBOARD_DAYS: ${WORKER_SCOREBOARD_DAYS:-3}
      WORKER_SKIP_ROSTERS: ${WORKER_SKIP_ROSTERS:-true}
      WORKER_SKIP_GAMES: ${WORKER_SKIP_GAMES:-true}
      WORKER_MAX_GAMES: ${WORKER_MAX_GAMES:-}
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      NO_PROXY: ${NO_PROXY:-postgres,backend,localhost,127.0.0.1}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app_net

  mlb-worker:
    # Same image as backend; only the command differs.
    image: ${BACKEND_IMAGE:-chudbet-backend}
    command: ["python", "-m", "app.worker.mlb_main"]
    restart: unless-stopped
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      MLB_WORKER_INGEST_INTERVAL_SEC: ${MLB_WORKER_INGEST_INTERVAL_SEC:-300}
      MLB_WORKER_SETTLE_INTERVAL_SEC: ${MLB_WORKER_SETTLE_INTERVAL_SEC:-300}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app_net

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      ACME_EMAIL: ${ACME_EMAIL}
      API_DOMAIN: ${API_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app_net

networks:
  app_net:
    driver: bridge

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
