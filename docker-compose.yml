services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-chudbet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chudbet}
      POSTGRES_DB: ${POSTGRES_DB:-chudbet}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: chudbet-backend
    ports:
      - "8000:8000"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-chudbet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chudbet}
      POSTGRES_DB: ${POSTGRES_DB:-chudbet}
      # Demo wallet used by frontend VITE_ACCOUNT_ID=1 (.env.development)
      CHUDBET_SEED_DEMO_WALLET: "true"
      CHUDBET_DEMO_ACCOUNT_ID: "1"
      CHUDBET_DEMO_WALLET_CENTS: "10000000"
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    # Reuses the image built by the backend service; only the command differs.
    image: chudbet-backend
    pull_policy: never
    command: ["python", "-m", "app.worker.main"]
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-chudbet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chudbet}
      POSTGRES_DB: ${POSTGRES_DB:-chudbet}
      NBA_SEASON: ${NBA_SEASON:-2025-26}
      # Light ingest: scoreboard-only + recent-first caps optional via WORKER_MAX_GAMES
      WORKER_INGEST_INTERVAL_SEC: "900"
      WORKER_SETTLE_INTERVAL_SEC: "120"
      WORKER_SCOREBOARD_DAYS: "3"
      # Eastern dates going back this many days still get scoreboard rows (needed when SKIP_GAMES=true).
      WORKER_SCOREBOARD_PAST_DAYS: "5"
      # Re-fetch box for every game on an OPEN ticket before grading (covers games outside scoreboard window).
      WORKER_REFRESH_OPEN_WAGER_GAMES_BEFORE_SETTLE: "true"
      WORKER_SKIP_ROSTERS: "true"
      WORKER_SKIP_GAMES: "true"
    depends_on:
      postgres:
        condition: service_healthy

  mlb-worker:
    # Reuses the image built by the backend service; only the command differs.
    image: chudbet-backend
    pull_policy: never
    command: ["python", "-m", "app.worker.mlb_main"]
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-chudbet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chudbet}
      POSTGRES_DB: ${POSTGRES_DB:-chudbet}
      MLB_WORKER_INGEST_INTERVAL_SEC: "300"
      MLB_WORKER_SETTLE_INTERVAL_SEC: "300"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
