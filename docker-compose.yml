services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-chudbet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chudbet}
      POSTGRES_DB: ${POSTGRES_DB:-chudbet}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-chudbet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chudbet}
      POSTGRES_DB: ${POSTGRES_DB:-chudbet}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
